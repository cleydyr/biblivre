name: push_docker

on:
  push:
    branches:
      - "master"
    tags:
      - "master-*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            cleydyr/biblivre
          tags: |
            type=sha
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: 'maven'
      - name: Get Node and Yarn versions
        id: frontend-versions
        run: |
          echo "node=$(grep -oP '(?<=<nodeVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "yarn=$(grep -oP '(?<=<yarnVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
      - name: Cache frontend-maven-plugin Node/Yarn downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/com/github/eirslett
          key: frontend-maven-plugin-${{ runner.os }}-${{ steps.frontend-versions.outputs.node }}-${{ steps.frontend-versions.outputs.yarn }}
          restore-keys: |
            frontend-maven-plugin-${{ runner.os }}-
      - name: Cache Yarn dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/yarn
            src/main/spa-frontend/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('src/main/spa-frontend/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Cache Dart Sass downloads
        uses: actions/cache@v6
        with:
          path: ~/.dart-sass-maven-plugin
          key: dart-sass-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dart-sass-${{ runner.os }}-
      - name: Build with Maven

        env:
          NODE_ENV: production
          BABEL_ENV: production
          BUILD_PATH: ../resources/META-INF/resources/static/
          PUBLIC_URL: /static/

        run: mvn clean test package -Pgithub-ci

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
