# Copy the Docker Hub images CI pulls into GHCR.
#
# GitHub-hosted runners share a Docker Hub quota (account "githubactions").
# Anonymous pulls of pgvector fail with toomanyrequests. This job logs in with
# the repository's Docker Hub credentials, copies the images once, and CI pulls
# the copies from GHCR instead.
#
# Images stay in sync with the GHCR names in .github/workflows/test.yml.

name: Mirror container images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [master]
    paths:
      - .github/workflows/mirror-container-images.yml

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: docker.io/pgvector/pgvector:pg16
            image: biblivre-pgvector
            tag: pg16
          - source: docker.io/pgvector/pgvector:pg18
            image: biblivre-pgvector
            tag: pg18
          - source: docker.io/library/eclipse-temurin:25.0.3_9-jre-jammy
            image: biblivre-eclipse-temurin
            tag: 25.0.3_9-jre-jammy
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"
          echo "Mirrored $SOURCE_IMAGE -> $TARGET_IMAGE"

      # GITHUB_TOKEN often cannot change visibility. Same-repo CI still pulls
      # with packages: read. Public makes fork CI and unauthenticated pulls work.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ matrix.image }}
        run: |
          gh api --method PUT \
            "/user/packages/container/${PACKAGE_NAME}/visibility" \
            -f visibility=public
