# CI + Docker publish for Biblivre
#
# PRs: build and test.
# Push to master / tags master-*: build, test, package, then publish Docker image
# from the packaged artifact (no second Maven run).

name: CI

on:
  push:
    branches: [master]
    tags: [master-*]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      BABEL_ENV: production
      BUILD_PATH: ../resources/META-INF/resources/static/
      PUBLIC_URL: /static/

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: "maven"
          server-id: ossindex
          server-username: ${{ secrets.OSSINDEX_USERNAME }}
          server-password: ${{ secrets.OSSINDEX_TOKEN }}

      - name: Get Node and Yarn versions
        id: frontend-versions
        run: |
          echo "node=$(grep -oP '(?<=<nodeVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "yarn=$(grep -oP '(?<=<yarnVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT

      - name: Cache frontend-maven-plugin Node/Yarn downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/com/github/eirslett
          key: frontend-maven-plugin-${{ runner.os }}-${{ steps.frontend-versions.outputs.node }}-${{ steps.frontend-versions.outputs.yarn }}
          restore-keys: |
            frontend-maven-plugin-${{ runner.os }}-

      - name: Cache Yarn dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/yarn
            src/main/spa-frontend/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('src/main/spa-frontend/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Cache Dart Sass downloads
        uses: actions/cache@v6
        with:
          path: ~/.dart-sass-maven-plugin
          key: dart-sass-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dart-sass-${{ runner.os }}-

      - name: Build with Maven
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -B -ntp clean test -Pgithub-ci
          else
            mvn -B -ntp clean test package -Pgithub-ci
          fi

      - name: Upload packaged app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: biblivre6-webapp
          path: target/Biblivre6
          retention-days: 1

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: biblivre6-webapp
          path: target/Biblivre6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            cleydyr/biblivre
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
