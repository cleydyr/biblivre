# CI + Docker publish for Biblivre
#
# PRs and pushes: Maven package (includes tests) and Playwright e2e against the
# packaged WAR. Push to master / tags master-* then publishes a Docker image
# from the packaged artifact (no second Maven run).

name: CI

on:
  push:
    branches: [master]
    tags: [master-*]
  pull_request:
    branches: [master]

# Cancel superseded PR runs (e.g. Renovate force-pushes). Keep master/tag
# runs so an in-flight Docker publish is not aborted by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default least privilege for GITHUB_TOKEN. Write scopes are granted per job
# (Sonar githubactions:S8233 / CodeQL missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact + actions/cache
    env:
      NODE_ENV: production
      BABEL_ENV: production
      BUILD_PATH: ../resources/META-INF/resources/static/
      PUBLIC_URL: /static/
      # Consumed by ~/.m2/settings.xml written by setup-java (${env.OSSINDEX_*}).
      OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
      OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: "25"
          cache: "maven"
          # setup-java expects env *names* here (not secret values).
          server-id: ossindex
          server-username: OSSINDEX_USERNAME
          server-password: OSSINDEX_TOKEN

      # Node/Corepack come from pom; Yarn version from packageManager (Yarn Berry via Corepack).
      - name: Get frontend toolchain versions
        id: frontend-versions
        run: |
          echo "node=$(grep -oP '(?<=<nodeVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "corepack=$(grep -oP '(?<=<corepackVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "packageManager=$(grep -oP '(?<="packageManager": ")[^"]+' src/main/spa-frontend/package.json)" >> $GITHUB_OUTPUT

      - name: Cache frontend-maven-plugin Node/Corepack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/com/github/eirslett
          key: frontend-maven-plugin-${{ runner.os }}-${{ steps.frontend-versions.outputs.node }}-${{ steps.frontend-versions.outputs.corepack }}
          restore-keys: |
            frontend-maven-plugin-${{ runner.os }}-

      # Yarn Berry global cache only — node_modules restore was ~16s and rarely worth it.
      - name: Cache Yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ steps.frontend-versions.outputs.packageManager }}-${{ hashFiles('src/main/spa-frontend/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ steps.frontend-versions.outputs.packageManager }}-
            yarn-${{ runner.os }}-

      - name: Cache Dart Sass downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dart-sass-maven-plugin
          key: dart-sass-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dart-sass-${{ runner.os }}-

      # package already runs tests. `mvn test package` would execute generate-resources
      # (Yarn/Vite) and compile twice. Pull Testcontainers (pg16, see
      # SharedPostgreSQLContainer) + smoke DB (pg18) in the background so
      # surefire/smoke do not wait on docker pull after Maven.
      - name: Build with Maven
        run: |
          docker pull pgvector/pgvector:pg16 >/tmp/docker-pull-pg16.log 2>&1 &
          docker compose -f docker-compose.dev.yml up -d database >/tmp/docker-compose-smoke-db.log 2>&1 &
          mvn -B -ntp clean package -Pgithub-ci
          wait || true
          echo "---- docker pull pg16 ----"
          cat /tmp/docker-pull-pg16.log || true
          echo "---- docker compose smoke db ----"
          cat /tmp/docker-compose-smoke-db.log || true

      # Real process boot (developer Spring profile + docker-compose.dev DB), not
      # @SpringBootTest/test profile — catches missing runtime beans such as
      # RestClient.Builder under Boot 4.1+.
      - name: Smoke start server (developer mode)
        run: ./scripts/smoke-dev.sh

      - name: Upload packaged WAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biblivre6-war
          path: target/Biblivre6.war
          retention-days: 1

      - name: Upload packaged app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biblivre6-webapp
          path: target/Biblivre6
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # download-artifact + upload-artifact
    env:
      BIBLIVRE_BASE_URL: http://localhost:8090
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged WAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: biblivre6-war
          path: target

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.1"
          cache: yarn
          cache-dependency-path: e2e/yarn.lock

      - name: Install Yarn classic
        run: npm install -g yarn@1.22.22

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Run Playwright e2e tests
        run: make e2e-run

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  docker:
    needs: [build, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # download-artifact + Buildx type=gha cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: biblivre6-webapp
          path: target/Biblivre6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            cleydyr/biblivre
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
