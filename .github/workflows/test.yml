# CI + Docker publish for Biblivre
#
# PRs: build and test.
# Push to master / tags master-*: build, test, package, then publish Docker image
# from the packaged artifact (no second Maven run).

name: CI

on:
  push:
    branches: [master]
    tags: [master-*]
  pull_request:
    branches: [master]

# Default least privilege for GITHUB_TOKEN. Write scopes are granted per job
# (Sonar githubactions:S8233 / CodeQL missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # upload-artifact + actions/cache
    env:
      NODE_ENV: production
      BABEL_ENV: production
      BUILD_PATH: ../resources/META-INF/resources/static/
      PUBLIC_URL: /static/
      # Consumed by ~/.m2/settings.xml written by setup-java (${env.OSSINDEX_*}).
      OSSINDEX_USERNAME: ${{ secrets.OSSINDEX_USERNAME }}
      OSSINDEX_TOKEN: ${{ secrets.OSSINDEX_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: "maven"
          # setup-java expects env *names* here (not secret values).
          server-id: ossindex
          server-username: OSSINDEX_USERNAME
          server-password: OSSINDEX_TOKEN

      # Node/Corepack come from pom; Yarn version from packageManager (Yarn Berry via Corepack).
      - name: Get frontend toolchain versions
        id: frontend-versions
        run: |
          echo "node=$(grep -oP '(?<=<nodeVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "corepack=$(grep -oP '(?<=<corepackVersion>)[^<]+' pom.xml)" >> $GITHUB_OUTPUT
          echo "packageManager=$(grep -oP '(?<="packageManager": ")[^"]+' src/main/spa-frontend/package.json)" >> $GITHUB_OUTPUT

      - name: Cache frontend-maven-plugin Node/Corepack downloads
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/com/github/eirslett
          key: frontend-maven-plugin-${{ runner.os }}-${{ steps.frontend-versions.outputs.node }}-${{ steps.frontend-versions.outputs.corepack }}
          restore-keys: |
            frontend-maven-plugin-${{ runner.os }}-

      # Yarn Berry global cache only — node_modules restore was ~16s and rarely worth it.
      - name: Cache Yarn dependencies
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ steps.frontend-versions.outputs.packageManager }}-${{ hashFiles('src/main/spa-frontend/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-${{ steps.frontend-versions.outputs.packageManager }}-
            yarn-${{ runner.os }}-

      - name: Cache Dart Sass downloads
        uses: actions/cache@v6
        with:
          path: ~/.dart-sass-maven-plugin
          key: dart-sass-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dart-sass-${{ runner.os }}-

      - name: Build with Maven
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -B -ntp clean test -Pgithub-ci
          else
            mvn -B -ntp clean test package -Pgithub-ci
          fi

      - name: Upload packaged app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: biblivre6-webapp
          path: target/Biblivre6
          retention-days: 1

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # download-artifact + Buildx type=gha cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download packaged app
        uses: actions/download-artifact@v4
        with:
          name: biblivre6-webapp
          path: target/Biblivre6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            cleydyr/biblivre
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
