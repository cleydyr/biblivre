version: "3"
services:
  app:
    build: .
    ports:
      - "$APP_HTTP_HOST_PORT:8080"
      - "$APP_DEBUG_HOST_PORT:8000"
    environment:
      - 'JAVA_OPTS="-agentlib:jdwp=transport=dt_socket,address=*:8000,server=y,suspend=n" -XX:+UnlockExperimentalVMOptions --enable-preview'
      - "DATABASE_HOST_NAME=$DATABASE_HOST_NAME"
      - "DATABASE_PORT=$DATABASE_HOST_PORT"
      - "PGUSER=biblivre"
      - "PGPASSWORD=$POSTGRES_PASSWORD"
      - "PGDATABASE=$POSTGRES_DB"
      - "DIGITAL_MEDIA_DAO_IMPL=$DIGITAL_MEDIA_DAO_IMPL"
      - "SPRING_MAIL_HOST=$SPRING_MAIL_HOST"
      - "SPRING_MAIL_PORT=$SPRING_MAIL_PORT"
      - "SPRING_MAIL_USERNAME=$SPRING_MAIL_USERNAME"
      - "SPRING_MAIL_PASSWORD=$SPRING_MAIL_PASSWORD"
      - "BIBLIVRE_CLIENT_MONITORING_DSN=$BIBLIVRE_CLIENT_MONITORING_DSN"
      - "BIBLIVRE_CLIENT_MONITORING_ENVIRONMENT=$BIBLIVRE_CLIENT_MONITORING_ENVIRONMENT"
    depends_on:
      - database
  database:
    image: pgvector/pgvector:pg18
    ports:
      - "$DATABASE_HOST_PORT:$POSTGRES_DEFAULT_PORT"
    volumes:
      - "./sql/biblivre4.sql:/docker-entrypoint-initdb.d/populate-initial-data.sql"
    environment:
      - "POSTGRES_USER=biblivre"
      - "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
      - "POSTGRES_DB=$POSTGRES_DB"
  web:
    image: nginx
    ports:
      - "$WEB_HTTP_HOST_PORT:80"
    volumes:
      - "./nginx/conf.d/:/etc/nginx/conf.d/"
    depends_on:
      - app

  # Browser error monitoring (docs/client-error-monitoring.md).
  # Start with: docker compose --profile monitoring up -d
  glitchtip-database:
    profiles: ["monitoring"]
    image: postgres:18
    # GlitchTip's partitioned tables need more locks than the Postgres default.
    command: -c max_locks_per_transaction=512
    environment:
      - "POSTGRES_USER=glitchtip"
      - "POSTGRES_PASSWORD=$GLITCHTIP_DATABASE_PASSWORD"
      - "POSTGRES_DB=glitchtip"
    volumes:
      - "glitchtip-pg-data:/var/lib/postgresql"
  glitchtip:
    profiles: ["monitoring"]
    image: glitchtip/glitchtip:6
    ports:
      - "$GLITCHTIP_HOST_PORT:8000"
    environment:
      - "SERVER_ROLE=all_in_one"
      - "DATABASE_URL=postgres://glitchtip:$GLITCHTIP_DATABASE_PASSWORD@glitchtip-database:5432/glitchtip"
      # Blank disables Valkey; Postgres then backs the task queue and cache.
      - "VALKEY_URL="
      - "SECRET_KEY=$GLITCHTIP_SECRET_KEY"
      - "GLITCHTIP_DOMAIN=$GLITCHTIP_DOMAIN"
      - "EMAIL_URL=$GLITCHTIP_EMAIL_URL"
      - "DEFAULT_FROM_EMAIL=$GLITCHTIP_DEFAULT_FROM_EMAIL"
    volumes:
      - "glitchtip-uploads:/code/uploads"
    depends_on:
      - glitchtip-database

volumes:
  glitchtip-pg-data:
  glitchtip-uploads:
